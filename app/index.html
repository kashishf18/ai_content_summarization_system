<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Summarization System</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --success-color: #10b981;
            --error-color: #ef4444;
            --glow-color: rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.5);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 1.75rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            position: relative;
        }

        .status-dot.ready {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
            animation: pulse 2s infinite;
        }

        .status-dot.loading {
            background-color: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
            animation: pulse 1.5s infinite;
        }

        .status-dot.error {
            background-color: var(--error-color);
            box-shadow: 0 0 10px var(--error-color);
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        main {
            flex-grow: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                margin: 1.5rem auto;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.05);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title i {
            color: #a855f7;
        }

        .textarea-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 20px var(--glow-color);
        }

        .textarea-info {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            border: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            flex-grow: 1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .output-box {
            width: 100%;
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            font-size: 1rem;
            line-height: 1.6;
            overflow-y: auto;
            color: var(--text-primary);
            min-height: 300px;
            user-select: text;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-style: italic;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 1rem;
            text-align: center;
        }

        .placeholder-icon {
            font-size: 3rem;
            opacity: 0.3;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.3);
        }

        footer a {
            color: #6366f1;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            background: #1f2937;
            color: #fff;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
            <h1>SummarizeAI</h1>
        </div>
        <div class="status-badge" id="statusBadge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Checking status...</span>
        </div>
    </header>

    <main>
        <!-- Input Panel -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-align-left"></i>
                Input Content
            </div>
            <div class="textarea-container">
                <textarea id="inputText"
                    placeholder="Paste your article, meeting dialogue, or long text here..."></textarea>
                <div class="textarea-info">
                    <span id="charCount">0 characters</span>
                    <span id="wordCount">0 words</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="clearBtn"><i class="fa-solid fa-trash-can"></i> Clear</button>
                <button class="btn-primary" id="summarizeBtn">
                    <i class="fa-solid fa-bolt"></i> Summarize
                </button>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-sparkles"></i>
                AI Summary Output
            </div>
            <div class="output-box" id="outputBox">
                <div class="placeholder-text" id="outputPlaceholder">
                    <i class="fa-solid fa-brain placeholder-icon"></i>
                    <p>Your abstractive summary will appear here.<br>Paste text on the left and click "Summarize" to
                        begin.</p>
                </div>
            </div>
            <div class="action-bar" style="display: none;" id="outputActions">
                <span style="font-size: 0.85rem; color: var(--text-secondary);" id="summaryStats">Summary Stats</span>
                <div class="btn-group">
                    <button class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;" id="copyBtn">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>AI Content Summarization System &bull; Powered by FastAPI & T5-small </p>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--success-color);" id="toastIcon"></i>
        <span id="toastMsg">Summary copied to clipboard!</span>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const clearBtn = document.getElementById('clearBtn');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const outputBox = document.getElementById('outputBox');
        const outputPlaceholder = document.getElementById('outputPlaceholder');
        const outputActions = document.getElementById('outputActions');
        const copyBtn = document.getElementById('copyBtn');
        const summaryStats = document.getElementById('summaryStats');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');

        // Check health status on load
        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                if (data.status === 'ready') {
                    statusDot.className = 'status-dot ready';
                    statusText.textContent = 'System Ready';
                    summarizeBtn.disabled = false;
                } else {
                    statusDot.className = 'status-dot loading';
                    statusText.textContent = 'AI Loading...';
                }
            } catch (err) {
                statusDot.className = 'status-dot error';
                statusText.textContent = 'AI Service Offline';
            }
        }

        // Run check health and repeat every 10 seconds
        checkHealth();
        setInterval(checkHealth, 10000);

        // Update counts
        inputText.addEventListener('input', () => {
            const text = inputText.value.trim();
            charCount.textContent = `${text.length} characters`;

            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = `${words} words`;
        });

        // Clear input
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            charCount.textContent = '0 characters';
            wordCount.textContent = '0 words';
            inputText.focus();
        });

        // Show Toast
        function showToast(message, isError = false) {
            toastMsg.textContent = message;
            toastIcon.className = isError ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
            toastIcon.style.color = isError ? 'var(--error-color)' : 'var(--success-color)';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Run prediction
        summarizeBtn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) {
                showToast('Please enter some text to summarize.', true);
                return;
            }

            // UI loading state
            summarizeBtn.disabled = true;
            const originalContent = summarizeBtn.innerHTML;
            summarizeBtn.innerHTML = '<div class="spinner"></div> Processing...';
            outputPlaceholder.style.display = 'none';
            outputBox.innerHTML = '<div class="placeholder-text"><div class="spinner"></div><p>AI is reading and condensing your text...</p></div>';
            outputActions.style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Failed to generate summary.');
                }

                const data = await response.json();

                // Display summary
                outputBox.innerHTML = `<p>${data.summary}</p>`;

                // Show actions & stats
                outputActions.style.display = 'flex';
                const summaryWords = data.summary.split(/\s+/).length;
                summaryStats.textContent = `Summary: ${summaryWords} words`;

            } catch (err) {
                outputBox.innerHTML = `
                    <div class="placeholder-text" style="color: var(--error-color);">
                        <i class="fa-solid fa-triangle-exclamation placeholder-icon" style="opacity: 0.8;"></i>
                        <p>Error generating summary:<br>${err.message}</p>
                    </div>
                `;
            } finally {
                summarizeBtn.disabled = false;
                summarizeBtn.innerHTML = originalContent;
            }
        });

        // Copy summary to clipboard
        copyBtn.addEventListener('click', () => {
            const text = outputBox.textContent.trim();
            if (!text) return;

            navigator.clipboard.writeText(text).then(() => {
                showToast('Summary copied to clipboard!');
            }).catch(() => {
                showToast('Failed to copy to clipboard.', true);
            });
        });
    </script>
</body>

</html>
